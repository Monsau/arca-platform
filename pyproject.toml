[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arca-platform"
version = "0.1.0"
description = "Deployment-neutral shared runtime foundation for Arca Suite"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
services = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
messaging = ["kafka-python-ng>=2.0"]
observability = ["opentelemetry-api>=1.24", "opentelemetry-sdk>=1.24"]
ontology = ["httpx>=0.27"]
tests = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
