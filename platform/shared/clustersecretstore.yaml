# External Secrets Operator backend (placeholder).
# A real ClusterSecretStore must be configured by the platform team with
# Vault credentials and policies. No secret value appears in this file.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.platform.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "arca-suite"
          serviceAccountRef:
            name: vault-auth
            namespace: arcasuite
