apiVersion: v1
kind: ConfigMap
metadata:
  name: arca-platform-shared
  namespace: arcasuite
data:
  # Bootstrap endpoints expected by every product module.
  # Real cluster addresses are patched per environment in the platform overlay.
  KAFKA_BOOTSTRAP_SERVERS: "kafka.platform.svc.cluster.local:9092"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.platform.svc.cluster.local:4317"
  VAULT_ADDR: "https://vault.platform.svc.cluster.local:8200"
